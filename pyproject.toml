[project]
name = "aiofetch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hari", email = "sudhan.hari690@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "tenacity>=9.2.1",
]

[project.scripts]
aiofetch = "aiofetch:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "openai>=3.35.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
