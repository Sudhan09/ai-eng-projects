[project]
name = "stream-svc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofetch==0.2.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "sse-starlette>=3.6.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
stream-svc = "stream_svc:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
aiofetch = { path = "../aiofetch" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
