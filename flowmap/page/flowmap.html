<title>aiofetch Flow Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one screen. A top band (project, parts, find), the map stage with two docked side panels (who's waiting on
   the left, details on the right) and the map fitted between them, a player band at the bottom.
   Black only, on purpose (the "Ice" palette): ice blue for your code's calls, mint for answers, red for errors,
   grey for everything at rest. Parallel tasks: white, orange, lime, pale yellow. Motion is "Synapse": signals with fading trails, hairlines that stay
   lit while a call waits, glows instead of rings, values written still inside the cards. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --bg-2: #050505;
  --panel: rgba(8, 8, 8, 0.95);
  --panel-solid: #0b0b0b;
  --line: #222222;
  --edge: #2b2b2b;
  --text: #ececec;
  --muted: #9a9a9a;
  --faint: #6e6e6e;
  --accent: #6fd3ff;
  --ok: #5cf2b0;
  --mark: #ffffff;
  --col: #8a8a8a;
  --k-fn: #bdbdbd;
  --k-class: #e0e0e0;
  --k-method: #a8a8a8;
  --k-inner: #8a8a8a;
  --k-test: #6fd3ff;
  --k-err: #ff4d5e;
  --t-str: #a6ecc8;
  --t-num: #9fdcff;
  --t-none: #6e6e6e;
  --t-coll: #ffd27a;
  --t-obj: #dedede;
  --t-err: #ff4d5e;
  --t-lib: #8f8f8f;
  --t-arr: #d0d0d0;
  --t-fn: #9a9a9a;
  --cond: #d0d0d0;
  --task-main: #6fd3ff;
  --task-T1: #ffffff;
  --task-T2: #ffa31a;
  --task-T3: #b8f27c;
  --task-T4: #ffe08a;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 14px; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }

/* ---------- top band ---------- */
.top { border-bottom: 1px solid var(--line); background: var(--bg-2); }
.top-in { display: flex; align-items: center; flex-wrap: nowrap; gap: 10px 18px; padding-block: 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; position: relative; flex: none; }
.brand-mark { width: 22px; height: 22px; flex: none; }
.proj-btn { display: flex; align-items: baseline; gap: 8px; background: none; border: 1px solid transparent; border-radius: 8px; padding: 4px 8px; }
.proj-btn:hover { border-color: var(--line); }
.proj-btn b { font-weight: 600; font-size: 15px; letter-spacing: .01em; }
.proj-btn span { color: var(--muted); font-family: var(--font-code); font-size: 12px; }
.proj-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; padding: 6px; min-width: 250px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
.proj-menu button { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 7px 9px; }
.proj-menu button:hover:not(:disabled) { background: #1c1c1c; }
.proj-menu button:disabled { color: var(--faint); cursor: default; }
.proj-menu small { color: var(--faint); font-family: var(--font-code); }
.parts { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 auto; }
.parts-label { color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.pills { display: flex; gap: 3px; background: #050505; border: 1px solid var(--line); border-radius: 999px; padding: 3px; overflow-x: auto; scrollbar-width: none; flex: none; }
.pill { min-width: 34px; height: 30px; border-radius: 999px; border: 0; background: none; color: var(--muted); font-family: var(--font-code); font-size: 12.5px; padding: 0 9px; }
.pill:hover { color: var(--text); background: #181818; }
.pill[aria-pressed="true"] { background: #222222; color: var(--text); box-shadow: inset 0 0 0 1px #3a3a3a; }
.pill.run { padding: 0 11px; font-family: var(--font-ui); }
.pill.run[aria-pressed="true"] { background: rgba(255, 255, 255, .1); color: var(--accent); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .5); }
.pill.soon { opacity: .4; box-shadow: inset 0 0 0 1px #2b2b2b; cursor: default; }
.pill.wip { outline: 1px dashed var(--t-coll); outline-offset: -4px; }
.pill:disabled { cursor: default; opacity: .35; }
.partsel { height: 30px; max-width: 340px; border-radius: 999px; border: 0; background: #181818; color: var(--text); font: 12.5px var(--font-ui); padding: 0 10px; }
.pill-sep { width: 1px; background: var(--line); margin: 5px 3px; flex: none; }
.grow-btn { height: 30px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--muted); padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 12.5px; flex: none; }
.grow-btn:hover, .grow-btn[aria-pressed="true"] { color: var(--text); border-color: #3a3a3a; }
.part-delta { color: var(--muted); font-size: 12.5px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.part-delta b { color: var(--text); font-weight: 500; }
.part-delta .plus { color: var(--mark); font-family: var(--font-code); }
.part-delta .edit { color: var(--t-coll); font-family: var(--font-code); }
.tools { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: none; }
.find { position: relative; }
.find input { width: 140px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: #050505; padding: 0 10px 0 30px; font-size: 13px; }
.find svg { position: absolute; left: 9px; top: 9px; width: 14px; height: 14px; color: var(--faint); pointer-events: none; }
.tog { height: 32px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--muted); padding: 0 10px; font-size: 12.5px; white-space: nowrap; }
.tog[aria-pressed="true"] { color: var(--text); background: #181818; border-color: #3a3a3a; }

/* ---------- stage ---------- */
.stage {
  position: relative; min-height: 0; overflow: hidden; --dock-l: 0px; --dock-r: 0px; background: var(--bg);
}
#graph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#graph:active { cursor: grabbing; }
.lvl { stroke: #151515; stroke-width: 1; }
.lvl-t { fill: #555555; font: 500 11px var(--font-code); text-anchor: end; letter-spacing: .03em; }

.tlink { fill: none; stroke: #333333; stroke-width: 1.7; transition: opacity .35s ease, stroke .9s ease, stroke-opacity .9s ease; }
.tlink.support { stroke: #333333; stroke-width: 1.3; stroke-dasharray: 5 3; }
.tlink.dormant { stroke: #2b2b2b; stroke-width: 1.1; stroke-dasharray: 2 4; }
.running .tlink.core { stroke: #222222; }
.running .tlink.core.done { stroke: #444444; }
/* a line stays lit while the call on it waits for its answer, then fades back (the transition above) */
.tlink.live { marker-end: url(#mAlive) !important; stroke: var(--tc, var(--accent)) !important; stroke-opacity: .95 !important; stroke-width: 1.2 !important; stroke-dasharray: none !important; filter: drop-shadow(0 0 3px color-mix(in srgb, var(--tc, var(--accent)) 70%, transparent)); }
.bypass { fill: none; stroke: var(--cond); stroke-width: 1.5; stroke-dasharray: 6 4; opacity: .85; }
.bypass-t { fill: var(--cond); font: 500 10px var(--font-code); }

.cond { pointer-events: none; transition: opacity .35s ease; }
.cond rect { fill: #111111; stroke: #3a3a3a; stroke-width: 1; }
.cond text { fill: var(--cond); font: 500 10px var(--font-code); }
.cond.dorm rect { stroke: #2a2a2a; stroke-dasharray: 2 2; }
.cond.dorm text { fill: #8a8a8a; }
.running .cond { opacity: .55; }
.running .cond.lit { opacity: 1; }

.tnode { cursor: pointer; transition: opacity .35s ease; }
.tnode .shape { fill: var(--kc); stroke: var(--bg); stroke-width: 1.6; }
.tnode.k-function { --kc: var(--k-fn); }
.tnode.k-class { --kc: var(--k-class); }
.tnode.k-class.is-err { --kc: var(--k-err); }
.tnode.k-method { --kc: var(--k-method); }
.tnode.k-inner { --kc: var(--k-inner); }
.tnode.k-inner .shape { fill: var(--bg); stroke: var(--k-inner); stroke-width: 1.5; stroke-dasharray: 2.2 1.8; }
.tnode.k-test, .tnode.k-tmain, .tnode.k-thelper { --kc: var(--k-test); }
.tnode .ring { fill: none; stroke: var(--kc); stroke-opacity: .5; stroke-width: 1.1; }
.tnode .halo { fill: none; stroke: none; stroke-width: 2; }
.tnode .hit { fill: transparent; stroke: none; pointer-events: all; }
.tnode.off .hit { pointer-events: none; }
.tnode .lbl { fill: #d0d0d0; font-family: var(--font-ui); font-weight: 600; font-size: 12px; text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.tnode.support .lbl { fill: var(--muted); font-weight: 500; font-size: 11px; }
.tnode.dormant .shape { fill: var(--bg); stroke: var(--kc); stroke-width: 1.3; stroke-dasharray: 2 2; }
.tnode.dormant .ring { stroke-dasharray: 2 2; }
.tnode.dormant .lbl { fill: #6e6e6e; font-weight: 400; font-style: italic; font-size: 10.5px; }
.tnode .ftext { fill: #6e6e6e; font: 400 9.5px var(--font-code); text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; }
.tnode .ctext { fill: var(--cond); font: 500 10px var(--font-code); text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; }
.tnode.dormant .ctext { fill: #8a8a8a; }
.tnode .cnt { fill: var(--muted); font: 600 9.5px var(--font-code); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; pointer-events: none; }
.tnode .dots circle { stroke: var(--bg); stroke-width: 1.2; }
.tnode.off, .tlink.off, .cond.off { opacity: 0 !important; pointer-events: none; }
.tnode.popin .shape, .tnode.popin .ring { animation: pop .5s cubic-bezier(.2,.7,.2,1) both; transform-box: fill-box; transform-origin: center; }
.tnode.popin .lbl { animation: fadein .5s .1s ease both; }
.running .tnode { opacity: .38; }
.running .tnode.visited { opacity: 1; }
.tnode.current .lbl, .tnode.live .lbl, .tnode.sel .lbl, .tnode.hv .lbl { fill: var(--text); }
.tnode.sel .halo { stroke: var(--text); stroke-opacity: .6; stroke-width: .9; stroke-dasharray: 3 3; }
.stage.hovering .tnode:not(.hv):not(.off) { opacity: .16; }
.stage.hovering .tnode.hv { opacity: 1; }
.stage.hovering .tlink:not(.hv):not(.off) { opacity: .12; }
.stage.hovering .cond:not(.hv):not(.off) { opacity: .12; }
.stage.searching .tnode:not(.match):not(.off) { opacity: .15; }
.stage.searching .tnode.match { opacity: 1; }

.tnode.future { opacity: .2 !important; }
.tnode.future .lbl { fill: var(--faint); }
.tlink.future { opacity: .14 !important; }
.cond.future { opacity: .14 !important; }
.build .tnode.dormant .shape { fill: var(--kc); stroke: var(--bg); stroke-width: 1.6; stroke-dasharray: none; }
.build .tnode.dormant .ring { stroke-dasharray: none; }
.build .tnode.dormant .lbl { font-style: normal; fill: var(--muted); }
.build .tlink.dormant { stroke: #333333; stroke-width: 1.3; stroke-dasharray: 5 3; }
.build .cond.dorm rect { stroke: #3a3a3a; stroke-dasharray: none; }
.build .cond.dorm text { fill: var(--cond); }
.build .stub { display: none; }
.flink { stroke: #3a3a3a; stroke-width: 1.5; }
.flink.end { stroke: #444444; }
.flink.err { stroke: #6a3442; stroke-dasharray: 5 4; }
.flink.retry { stroke: #7a3646; stroke-width: 1.6; stroke-dasharray: 6 4; marker-end: url(#arrowR); }
.running .flink { stroke: #222222; }
.running .flink.done { stroke: #4a4a4a; }
.running .flink.err.done { stroke: #9a4456; }
.running .flink.retry.done { stroke: var(--t-err); }
.rlabel { fill: var(--t-err); font: 500 10px var(--font-code); text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; pointer-events: none; }
.tnode .ctext.out-ok { fill: var(--t-coll); }
.tnode .ctext.out-err { fill: var(--t-err); font-weight: 600; }
.tnode .ctext.out-run { fill: var(--faint); }
.tnode.k-end { --kc: var(--accent); }
.tnode.fend .shape { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
.tnode.fend.visited .shape { fill: var(--accent); }
.tnode.fstart .lbl, .tnode.fend .lbl { font-weight: 700; letter-spacing: .08em; fill: var(--text); }
.flowv .tnode .lbl { font-size: 13px; }
.flowv .tnode .ftext { font-size: 10px; }
.flowv .tnode .ctext { font-size: 11px; }
.flowv .rlabel { font-size: 11px; }
.htag { pointer-events: none; }
.htag rect { fill: #111111; stroke: #3a3a3a; }
.htag text { fill: var(--cond); font: 500 10px var(--font-code); }
.stub { cursor: pointer; }
.stub rect { fill: #141414; stroke: #3a3a3a; stroke-width: 1; }
.stub text { fill: var(--muted); font: 600 10px var(--font-code); pointer-events: none; }
.stub:hover rect { stroke: var(--accent); }
.stub:hover text { fill: var(--text); }
.stub.dorm rect { stroke-dasharray: 2 2; }
.stub.open rect { stroke: #555555; }

.ty-str { --tyc: var(--t-str); } .ty-num { --tyc: var(--t-num); } .ty-none { --tyc: var(--t-none); }
.ty-coll { --tyc: var(--t-coll); } .ty-obj { --tyc: var(--t-obj); } .ty-err { --tyc: var(--t-err); }
.ty-lib { --tyc: var(--t-lib); } .ty-arr { --tyc: var(--t-arr); } .ty-fn { --tyc: var(--t-fn); }
/* a signal: a bright core, a soft glow and a fading trail; the line behind it lights up, then fades */
.sgnl { pointer-events: none; mix-blend-mode: screen; }
.sgnl .tr { fill: var(--sc); }
.siglit { fill: none; stroke: var(--sc); stroke-width: 1.4; stroke-linecap: round; pointer-events: none; mix-blend-mode: screen; filter: drop-shadow(0 0 3px var(--sc)); }
/* a card that just got something: its border and a soft glow light up and fade, no growing ring */
.pulse { fill: color-mix(in srgb, var(--pc, var(--accent)) 9%, transparent); stroke: var(--pc, var(--accent)); stroke-width: 1.2; pointer-events: none; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--pc, var(--accent)) 70%, transparent)); }
.snote { pointer-events: none; }
.snote rect { fill: rgba(0, 0, 0, .92); stroke: color-mix(in srgb, var(--fc, var(--text)) 45%, transparent); stroke-width: 1; }
.snote text { font: 500 10px var(--font-code); fill: var(--fc, var(--text)); text-anchor: end; }
.waitb { font: 600 11px var(--font-code); fill: var(--t-coll); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; text-anchor: end; pointer-events: none; }

/* floating panels */
.panel { position: absolute; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.45); backdrop-filter: blur(6px); }
/* both side panels are docked: full height, and the map is fitted in the room between them (fit() reads --dock-l/-r) */
.stack { left: var(--gutter-l); top: 12px; bottom: 12px; width: 248px; display: flex; flex-direction: column; overflow: hidden; }
.stack.collapsed .stack-body { display: none; }
.stack.collapsed .panel-head { border-bottom: 0; }
.stack.collapsed { width: 40px; }
.stack.collapsed .panel-head { flex-direction: column; align-items: center; gap: 10px; padding: 7px 0; cursor: pointer; flex: 1; }
.stack.collapsed .icon-btn { margin: 0; }
.stack.collapsed .panel-title { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 12px; border-bottom: 1px solid var(--line); }
.panel-title { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.icon-btn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; border: 0; background: none; color: var(--muted); margin-left: auto; }
.icon-btn:hover { background: #1c1c1c; color: var(--text); }
.icon-btn svg { width: 15px; height: 15px; }
.tasks { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px 2px; }
.tasks:empty { display: none; }
.task-tab { display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); background: none; font: 500 11px var(--font-code); color: var(--muted); }
.task-tab i { width: 7px; height: 7px; border-radius: 50%; background: var(--tc); }
.task-tab[aria-pressed="true"] { color: var(--text); border-color: var(--tc); }
.task-tab.done { opacity: .5; }
.stack-body { overflow-y: auto; padding: 6px 0 8px; min-height: 0; }
.frames { list-style: none; margin: 0; padding: 0 8px; display: flex; flex-direction: column; gap: 3px; }
.frame { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 7px; align-items: start; padding: 6px 8px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; background: none; text-align: left; width: 100%; }
.frame:hover { background: #181818; }
.frame .fdot { width: 9px; height: 9px; margin-top: 4px; border-radius: 50%; border: 2px solid var(--fc, var(--k-fn)); }
.frame.top { border-color: var(--tc, var(--accent)); background: #141414; }
.frame.top .fdot { background: var(--tc, var(--accent)); border-color: var(--tc, var(--accent)); }
.frame .fname { font: 500 12px var(--font-code); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frame .fargs { font: 11px var(--font-code); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frame .fwait { font: 11px var(--font-code); color: var(--faint); }
.frame .fgot { font: 11px var(--font-code); color: var(--t-coll); }
.frame.under { opacity: .55; }
.frame.you .fname { color: var(--accent); }
.stack-empty { color: var(--faint); font-size: 12.5px; padding: 8px 14px 10px; }
.stack-foot { color: var(--faint); font: 11px var(--font-code); padding: 4px 16px 0; }

.insp { right: var(--gutter-r); top: 14px; width: 390px; max-height: calc(100% - 28px); display: flex; flex-direction: column; overflow: hidden; }
.insp { --bz: .8; }
.insp > .panel-head, .insp-body { zoom: var(--bz); }
.insp > .panel-head { flex-wrap: wrap; row-gap: 6px; }
.tname { min-width: 0; }
.fsz { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.fsz button { height: 26px; padding: 0 8px; border: 0; background: none; color: var(--muted); font: 600 11px var(--font-code); }
.fsz button + button { border-left: 1px solid var(--line); }
.fsz button:hover:not(:disabled) { color: var(--text); background: #1c1c1c; }
.fsz button:disabled { opacity: .35; cursor: default; }
.insp-body { overflow-y: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.ihead { display: flex; flex-direction: column; gap: 5px; }
.ikinds { display: flex; gap: 5px; flex-wrap: wrap; }
.kchip { font: 500 10.5px var(--font-code); padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.kchip.k { color: var(--kc2); border-color: var(--kc2); }
.kchip.c { color: var(--cond); border-color: #3a3a3a; }
.ititle { font: 600 15px var(--font-code); color: var(--text); overflow-wrap: anywhere; }
.ititle .sig { color: var(--muted); font-weight: 400; }
.idesc { color: var(--text); font-size: 13.5px; }
.iwhere { color: var(--faint); font: 11.5px var(--font-code); }
.sec { display: flex; flex-direction: column; gap: 6px; }
.sec-h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-h small { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); font-family: var(--font-code); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font: 11.5px var(--font-code); }
.crumbs .sep { color: var(--faint); }
.crumbs button { background: none; border: 0; padding: 1px 2px; color: var(--muted); font: inherit; border-radius: 4px; }
.crumbs button:hover { color: var(--text); background: #181818; }
.crumbs .here { color: var(--text); font-weight: 600; }

/* ---------- map ---------- */

.mcolbg { fill: rgba(255, 255, 255, .015); stroke: rgba(255, 255, 255, .06); stroke-width: 1; }

(() => {

}
function parentOf(id) {

}
function labelOf(id) {

}

}
const fileName = id => { const n = NODE[id] || {}; return n.file ? n.file.split('/').pop() : n.mod && n.mod !== 'lib' ? n.mod + '.py' : ''; };

const KWORD = { function: 'function', class: 'class', method: 'method', inner: 'inner function', lib: 'library', test: 'test', tmain: 'test · async main', thelper: 'test helper' };

/* ================================================================ values */
function tyClass(v) {
  if (!v) return 'none';
  const t = v.t;
  if (t === 'None') return 'none';
  if (t === 'str') return 'str';
  if (t === 'int' || t === 'float' || t === 'bool' || (t && t.startsWith('np.'))) return 'num';
  if (t === 'dict' || t === 'list' || t === 'tuple') return 'coll';
  if (t === 'ndarray') return 'arr';
  if (t === 'function' || t === 'type') return 'fn';

  if (v.obj) return 'obj';

  if (!v) return '';
  switch (v.t) {
    case 'ndarray': return `ndarray ${v.dtype} (${v.shape.join(', ')})`;
    case 'list': case 'tuple': {
      const its = v.items || [];
      const inner = its.length && its.every(x => x.t === its[0].t) ? its[0].t : null;
      return inner ? `${v.t}[${inner}] ×${v.n}` : `${v.t} ×${v.n}`;

    default: return v.t;

function objName(oid) {
  if (RUN && RUN.names[oid]) return RUN.names[oid].short;
  return RUN && RUN.objects && RUN.objects[oid] ? RUN.objects[oid].name.replace(/#\d+$/, '') : oid;  // ApiError, not ApiError#1
}
function chipText(v) {
  if (!v) return '';
  switch (v.t) {
    case 'None': return 'None';
    case 'str': return "'" + midTrunc(v.v, 20) + "'";
    case 'int': return String(v.v);
    case 'bool': return v.v ? 'True' : 'False';
    case 'float': return fmtNum(v.v);
    case 'dict': return v.items ? '{' + v.items.slice(0, 3).map(i => i[0]).join(', ') + (v.n > 3 ? ', …' : '') + '}' : `dict ×${v.n}`;
    case 'list': case 'tuple': {
      const its = v.items || [];
      if (its.length && its.every(x => x.t === its[0].t)) {
        const t0 = its[0];
        const nm = t0.t === 'float' ? 'floats' : t0.t === 'str' ? 'str' : t0.t;

      }
      return `${v.t} ×${v.n}`;
    }
    case 'ndarray': return `ndarray ${v.shape.join('×')}`;
    case 'function': return (v.v || '').split('.').pop() + '()';
    case 'type': return v.v + ' (class)';
  }
  if (tyClass(v) === 'err') return '⚡' + v.t;
  if (v.obj) return objName(v.obj);
  if (v.t === 'Response') return 'Response ' + ((v.v || '').match(/\[(\d+)/) || [, ''])[1];
  if (v.t === 'Request') return 'GET ' + (v.v || '').split(' ').pop().replace(/^https?:\/\/[^/]+/, '');
  if (v.t === 'MockTransport' || v.t === 'AsyncClient' || v.t === 'RetryCallState' || v.t === 'AsyncRetrying' || v.t === 'coroutine') return v.t;

function vInline(v, budget = 90) {

      return span('coll', '{') + parts.join('<span class="v-k">, </span>') + (v.n > v.items.length ? '<span class="v-k">, …</span>' : '') + span('coll', '}');

    case 'list': case 'tuple': {
      const [o, cl] = v.t === 'list' ? ['[', ']'] : ['(', ')'];
      if (!v.items) return span('coll', `${v.t} ×${v.n}`);
      const shown = v.items.slice(0, 8).map(x => vInline(x, 60));
      return span('coll', o) + shown.join('<span class="v-k">, </span>') + (v.n > 8 ? `<span class="v-k">, … ${v.n} items</span>` : '') + span('coll', cl);
    }
    case 'ndarray': return span('arr', `ndarray ${esc(v.dtype)} (${v.shape.join(', ')})`);

    const ed = P.changed.filter(x => !P.added.includes(x)).length;
    if (ed) bits.push(`<span class="edit">~${ed} changed</span>`);
  }
  $('#partDelta').innerHTML = bits.join(' · ');
}
function setPart(i, autoplay) {
  stop();
  partIdx = i;
  RUNS = runsFor(i);
  fillRunSel();
  renderPills();
  renderPartDelta();
  growNext = true;  // new pieces of this Part grow into the map
  loadRun(0);
  if (autoplay && !reduceMotion) setTimeout(() => { if (!playing && partIdx === i && idx <= startIdx()) play(); }, 1500);
}
let growTimer = null;
function stopGrow() { if (growTimer) { clearTimeout(growTimer); growTimer = null; } $('#growBtn').setAttribute('aria-pressed', 'false'); }
$('#growBtn').onclick = () => {
  if (growTimer) { stopGrow(); return; }
  closeInspector();
  $('#growBtn').setAttribute('aria-pressed', 'true');
  let i = 0;
  const step = () => {
    growTimer = i < PARTS.length - 1 ? setTimeout(step, reduceMotion ? 400 : 2600) : null;
    setPart(i, false);
    i++;
    if (!growTimer) $('#growBtn').setAttribute('aria-pressed', 'false');
  };
  step();
};

/* ================================================================ chrome */
$('#branchTog').onclick = () => setAllCols(!TREE.cols.every(c => c.single || c.open));
$('#followTog').onclick = () => setFollow(!follow);
$('#stack .panel-head').onclick = () => {
  const st = $('#stack');
  st.classList.toggle('collapsed');
  const open = !st.classList.contains('collapsed');
  $('#stackTog').setAttribute('aria-expanded', open);
  $('#stackTog').setAttribute('aria-label', open ? "Hide who's waiting" : "Show who's waiting");
  $('#stackTog').innerHTML = open ? '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>' : '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>';
  if (applyDock()) fit(400);
};
const projBtn = $('#projBtn'), projMenu = $('#projMenu');
// one line per project in the data (a new week appears here by itself): its week, name, and where its last Part is
const menuNote = p => { const last = p.parts[p.parts.length - 1]; return last.inProgress ? `Part ${last.label} in progress` : p.branch; };
projMenu.innerHTML = DATA.projects.map(p => `<button data-project="${esc(p.key)}" aria-current="${p.key === D.key}">${esc(p.key)} · ${esc(p.name)} <small>${esc(menuNote(p))}</small></button>`).join('');
projMenu.querySelectorAll('[data-project]').forEach(b => { b.onclick = () => { projMenu.hidden = true; projBtn.setAttribute('aria-expanded', 'false'); if (b.dataset.project !== D.key) useProject(b.dataset.project); }; });
projBtn.onclick = ev => { ev.stopPropagation(); projMenu.hidden = !projMenu.hidden; projBtn.setAttribute('aria-expanded', !projMenu.hidden); };
document.addEventListener('click', ev => { if (!projMenu.hidden && !projMenu.contains(ev.target)) { projMenu.hidden = true; projBtn.setAttribute('aria-expanded', 'false'); } });
const find = $('#find');
find.oninput = () => {
  const q = find.value.trim().toLowerCase();
  stage.classList.toggle('searching', !!q);
  const hit = t => !!q && !t.isCol && (t.fn.toLowerCase().includes(q) || labelOf(t.fn).toLowerCase().includes(q));
  tSel.classed('match', t => (t.isCol ? t.col.fns.some(hit) || t.col.spec.name.toLowerCase().includes(q) && !!q : hit(t)));
};
find.onkeydown = ev => {
  if (ev.key === 'Enter') {
    const q = find.value.trim().toLowerCase(); const f = [...TREE.nodes.values()].find(t => !t.isCol && q && (t.fn.toLowerCase().includes(q) || labelOf(t.fn).toLowerCase().includes(q))); if (f) { find.blur(); selectT(f.key); find.oninput(); }
  }
  if (ev.key === 'Escape') { find.value = ''; find.oninput(); find.blur(); }
};
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (ev.key === ' ' && !(t && t.tagName === 'BUTTON')) { ev.preventDefault(); playing ? stop() : play(); }
  else if (ev.key === 'ArrowRight') { ev.preventDefault(); stop(); resumeFollow(); stepForward(true); }
  else if (ev.key === 'ArrowLeft') { ev.preventDefault(); stop(); resumeFollow(); stepBack(true); }
  else if (ev.key === 'Home') { stop(); resumeFollow(); jump(startIdx()); }
  else if (ev.key === 'Escape') userCloseBox();
  else if (ev.key === 'f' || ev.key === 'F') fit();
});
let lastSize = [0, 0], resizeT = null;
new ResizeObserver(() => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    const [w, h] = stageSize();
    if (Math.abs(w - lastSize[0]) > 8 || Math.abs(h - lastSize[1]) > 8) { lastSize = [w, h]; fit(0); }
  }, 120);
}).observe(stage);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
  // real label widths are known now: lay the tree out again
  if (!TREE) return;
  layoutView();
  drawView();
  renderState();
  if (idx === 0) fit(0);
});

/* ================================================================ boot */
const wanted = (location.hash || '').slice(1).toUpperCase();
useProject(DATA.projects.some(p => p.key === wanted) ? wanted : 'W3');
if (!reduceMotion) setTimeout(() => { if (!playing && idx <= startIdx()) play(); }, 2600);
/*__DEBUG_HOOK__*/
})();
</script>
